
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#050514">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PIXEL BLAST">
<link rel="manifest" href="manifest.json">
<title>PIXEL BLAST v2</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #050514;
  color: white;
  font-family: monospace;
  touch-action: none;
}

canvas {
  display: block;
  width: 100%;
  height: 100%;
  image-rendering: pixelated;
}

#hud {
  position: fixed;
  top: 12px;
  left: 12px;
  right: 12px;
  display: flex;
  justify-content: space-between;
  gap: 8px;
  z-index: 5;
  pointer-events: none;
  font-size: 13px;
  text-shadow: 2px 2px #000;
}

#message {
  position: fixed;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  background: rgba(3, 3, 18, .78);
  text-align: center;
  z-index: 10;
  padding: 20px;
}

#message h1 {
  color: #00ffff;
  font-size: clamp(25px, 8vw, 50px);
  margin: 8px;
  text-shadow: 4px 4px #2222aa;
}

#message p {
  font-size: 14px;
  line-height: 1.8;
}

button {
  background: #15154a;
  color: #00ffff;
  border: 2px solid #00ffff;
  padding: 13px 25px;
  font: bold 15px monospace;
  border-radius: 8px;
}

#controls {
  position: fixed;
  bottom: 22px;
  left: 18px;
  right: 18px;
  display: flex;
  justify-content: space-between;
  align-items: end;
  z-index: 6;
  pointer-events: none;
}

.control {
  pointer-events: auto;
  width: 68px;
  height: 68px;
  border: 2px solid #5555ff;
  border-radius: 50%;
  background: rgba(20, 20, 80, .65);
  color: white;
  font-size: 24px;
  user-select: none;
  touch-action: none;
}

#fire {
  width: 85px;
  height: 85px;
  border-color: #ff4477;
  color: #ff4477;
  font-size: 14px;
  font-weight: bold;
}

#pad {
  display: flex;
  gap: 10px;
}

#sound {
  position: fixed;
  top: 45px;
  right: 12px;
  z-index: 7;
  font-size: 12px;
  padding: 5px 8px;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">
  <span id="score">SCORE: 0</span>
  <span id="level">LEVEL: 1</span>
  <span id="lives">LIVES: 3</span>
  <span id="record">BEST: 0</span>
</div>

<button id="sound">🔊 SOUND</button>

<div id="message">
  <h1>PIXEL BLAST</h1>
  <p id="info">
    DESTROY THE ENEMIES<br>
    MOVE • SHOOT • SURVIVE
  </p>
  <button id="start">START GAME</button>
</div>

<div id="controls">
  <div id="pad">
    <button class="control" id="left">◀</button>
    <button class="control" id="right">▶</button>
  </div>
  <button class="control" id="fire">FIRE</button>
</div>

<script>
"use strict";

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W = 360;
let H = 640;

function resize() {
  W = Math.max(280, Math.floor(innerWidth));
  H = Math.max(400, Math.floor(innerHeight));
  canvas.width = W;
  canvas.height = H;
}
addEventListener("resize", resize);
resize();

const scoreEl = document.getElementById("score");
const levelEl = document.getElementById("level");
const livesEl = document.getElementById("lives");
const recordEl = document.getElementById("record");
const message = document.getElementById("message");
const info = document.getElementById("info");

let running = false;
let gameOver = false;
let score = 0;
let level = 1;
let lives = 3;
let record = Number(localStorage.getItem("pixelBlastRecord") || 0);
let last = 0;
let spawnTimer = 0;
let bossTimer = 0;
let boss = null;
let soundOn = true;
let audioCtx = null;

const keys = {};
const bullets = [];
const enemyBullets = [];
const enemies = [];
const particles = [];
const stars = [];

const player = {
  x: W / 2,
  y: H - 115,
  w: 24,
  h: 30,
  speed: 270,
  cooldown: 0,
  invincible: 0
};

for (let i = 0; i < 90; i++) {
  stars.push({
    x: Math.random() * W,
    y: Math.random() * H,
    speed: 20 + Math.random() * 80,
    size: Math.random() < .8 ? 1 : 2
  });
}

function updateHud() {
  scoreEl.textContent = "SCORE: " + score;
  levelEl.textContent = "LEVEL: " + level;
  livesEl.textContent = "LIVES: " + lives;
  recordEl.textContent = "BEST: " + record;
}

function beep(freq, duration, type = "square", volume = .035) {
  if (!soundOn) return;

  try {
    audioCtx ||= new (window.AudioContext || window.webkitAudioContext)();

    if (audioCtx.state === "suspended") {
      audioCtx.resume();
    }

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.value = volume;

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    const now = audioCtx.currentTime;
    gain.gain.setValueAtTime(volume, now);
    gain.gain.exponentialRampToValueAtTime(.001, now + duration);

    osc.start(now);
    osc.stop(now + duration);
  } catch (e) {}
}

function shootSound() {
  beep(720, .07, "square", .025);
}

function explosionSound() {
  beep(90, .16, "sawtooth", .05);
}

function damageSound() {
  beep(150, .25, "triangle", .05);
}

function resetGame() {
  score = 0;
  level = 1;
  lives = 3;
  spawnTimer = 0;
  bossTimer = 0;
  boss = null;
  bullets.length = 0;
  enemyBullets.length = 0;
  enemies.length = 0;
  particles.length = 0;

  player.x = W / 2;
  player.y = H - 115;
  player.cooldown = 0;
  player.invincible = 0;

  updateHud();
}

function startGame() {
  resetGame();
  running = true;
  gameOver = false;
  message.style.display = "none";
  beep(500, .1);
}

document.getElementById("start").addEventListener("click", () => {
  startGame();
});

document.getElementById("sound").addEventListener("click", () => {
  soundOn = !soundOn;
  document.getElementById("sound").textContent =
    soundOn ? "🔊 SOUND" : "🔇 MUTED";

  if (soundOn) beep(600, .08);
});

function createEnemy() {
  const types = ["normal", "fast", "tank", "zigzag"];
  const type = types[Math.floor(Math.random() * types.length)];

  const settings = {
    normal: { hp: 1, speed: 70, points: 10, size: 18 },
    fast: { hp: 1, speed: 145, points: 20, size: 15 },
    tank: { hp: 3, speed: 42, points: 45, size: 25 },
    zigzag: { hp: 2, speed: 90, points: 35, size: 20 }
  };

  const s = settings[type];

  enemies.push({
    x: 20 + Math.random() * (W - 40),
    y: -30,
    w: s.size,
    h: s.size,
    hp: s.hp,
    maxHp: s.hp,
    speed: s.speed + level * 3,
    points: s.points,
    type,
    phase: Math.random() * 6
  });
}

function createBoss() {
  boss = {
    x: W / 2,
    y: -70,
    w: 95,
    h: 65,
    hp: 80 + level * 20,
    maxHp: 80 + level * 20,
    speed: 35,
    direction: 1,
    cooldown: 1.5
  };

  beep(100, .7, "sawtooth", .08);
}

function shoot() {
  if (!running || player.cooldown > 0) return;

  bullets.push({
    x: player.x,
    y: player.y - 25,
    speed: 500,
    w: 4,
    h: 13
  });

  player.cooldown = .18;
  shootSound();
}

function enemyShoot(e) {
  enemyBullets.push({
    x: e.x,
    y: e.y + e.h,
    vx: (player.x - e.x) * .12,
    vy: 145 + level * 5,
    size: 5
  });
}

function bossShoot() {
  if (!boss) return;

  for (let i = -1; i <= 1; i++) {
    enemyBullets.push({
      x: boss.x + i * 25,
      y: boss.y + boss.h / 2,
      vx: i * 65,
      vy: 180 + level * 4,
      size: 7
    });
  }

  beep(170, .12, "sawtooth", .04);
}

function hit(a, b) {
  return Math.abs(a.x - b.x) < (a.w + b.w) / 2 &&
         Math.abs(a.y - b.y) < (a.h + b.h) / 2;
}

function explode(x, y, amount = 12) {
  for (let i = 0; i < amount; i++) {
    particles.push({
      x,
      y,
      vx: (Math.random() - .5) * 180,
      vy: (Math.random() - .5) * 180,
      life: .3 + Math.random() * .5,
      size: 2 + Math.random() * 4
    });
  }
  explosionSound();
}

function damagePlayer() {
  if (player.invincible > 0) return;

  lives--;
  player.invincible = 1.4;
  damageSound();
  explode(player.x, player.y, 18);
  updateHud();

  if (lives <= 0) endGame();
}

function endGame() {
  running = false;
  gameOver = true;

  if (score > record) {
    record = score;
    localStorage.setItem("pixelBlastRecord", record);
  }

  updateHud();

  message.style.display = "flex";
  info.innerHTML =
    "GAME OVER<br><br>SCORE: " + score +
    "<br>BEST: " + record;

  document.getElementById("start").textContent = "PLAY AGAIN";
}

function update(dt) {
  if (!running) return;

  level = 1 + Math.floor(score / 300);

  player.cooldown -= dt;
  player.invincible -= dt;

  let direction = 0;

  if (keys.ArrowLeft || keys.a || touch.left) direction--;
  if (keys.ArrowRight || keys.d || touch.right) direction++;

  player.x += direction * player.speed * dt;
  player.x = Math.max(18, Math.min(W - 18, player.x));

  if (touch.fire || keys[" "] || keys.Enter) shoot();

  for (const star of stars) {
    star.y += star.speed * dt;

    if (star.y > H) {
      star.y = -3;
      star.x = Math.random() * W;
    }
  }

  spawnTimer -= dt;

  if (spawnTimer <= 0 && !boss) {
    createEnemy();
    spawnTimer = Math.max(.25, .85 - level * .035);
  }

  bossTimer += dt;

  if (bossTimer > 30 && !boss) {
    bossTimer = 0;
    enemies.length = 0;
    createBoss();
  }

  for (const b of bullets) {
    b.y -= b.speed * dt;
  }

  for (const b of enemyBullets) {
    b.x += b.vx * dt;
    b.y += b.vy * dt;
  }

  for (const e of enemies) {
    e.y += e.speed * dt;

    if (e.type === "zigzag") {
      e.x += Math.sin(e.y * .035 + e.phase) * 75 * dt;
    }

    if (e.type === "normal" && Math.random() < dt * .15) {
      enemyShoot(e);
    }

    if (e.y > H + 40) {
      e.y = -30;
      e.x = Math.random() * W;
    }

    if (hit(player, e)) {
      damagePlayer();
      e.y = -100;
    }
  }

  if (boss) {
    if (boss.y < 100) boss.y += 40 * dt;

    boss.x += boss.direction * boss.speed * dt;

    if (boss.x < boss.w / 2 || boss.x > W - boss.w / 2) {
      boss.direction *= -1;
    }

    boss.cooldown -= dt;

    if (boss.cooldown <= 0) {
      bossShoot();
      boss.cooldown = Math.max(.45, 1.2 - level * .03);
    }

    if (hit(player, boss)) damagePlayer();
  }

  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];

    if (b.y < -30) {
      bullets.splice(i, 1);
      continue;
    }

    let removed = false;

    for (let j = enemies.length - 1; j >= 0; j--) {
      const e = enemies[j];

      if (hit(b, e)) {
        bullets.splice(i, 1);
        e.hp--;
        explode(b.x, b.y, 4);
        removed = true;

        if (e.hp <= 0) {
          score += e.points;
          explode(e.x, e.y, 15);
          enemies.splice(j, 1);
          updateHud();
        }

        break;
      }
    }

    if (removed) continue;

    if (boss && hit(b, boss)) {
      bullets.splice(i, 1);
      boss.hp--;
      explode(b.x, b.y, 3);

      if (boss.hp <= 0) {
        score += 500;
        explode(boss.x, boss.y, 45);
        boss = null;
        bossTimer = 0;
        updateHud();
      }
    }
  }

  for (let i = enemyBullets.length - 1; i >= 0; i--) {
    const b = enemyBullets[i];

    if (b.y > H + 20 || b.x < -30 || b.x > W + 30) {
      enemyBullets.splice(i, 1);
      continue;
    }

    const target = {
      x: b.x,
      y: b.y,
      w: b.size * 2,
      h: b.size * 2
    };

    if (hit(player, target)) {
      enemyBullets.splice(i, 1);
      damagePlayer();
    }
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];

    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.life -= dt;

    if (p.life <= 0) particles.splice(i, 1);
  }

  updateHud();
}

function draw() {
  ctx.fillStyle = "#050514";
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = "#aaaaff";

  for (const star of stars) {
    ctx.fillRect(star.x, star.y, star.size, star.size);
  }

  drawPlayer();

  for (const b of bullets) {
    ctx.fillStyle = "#00ffff";
    ctx.fillRect(b.x - 2, b.y - 7, 4, 13);
  }

  for (const b of enemyBullets) {
    ctx.fillStyle = "#ff3355";
    ctx.fillRect(b.x - b.size / 2, b.y - b.size / 2, b.size, b.size);
  }

  for (const e of enemies) drawEnemy(e);

  if (boss) drawBoss();

  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life * 2);
    ctx.fillStyle = "#ffaa22";
    ctx.fillRect(p.x, p.y, p.size, p.size);
  }

  ctx.globalAlpha = 1;
}

function drawPlayer() {
  if (player.invincible > 0 && Math.floor(player.invincible * 12) % 2 === 0) {
    return;
  }

  ctx.fillStyle = "#00ffff";

  ctx.beginPath();
  ctx.moveTo(player.x, player.y - 25);
  ctx.lineTo(player.x - 17, player.y + 20);
  ctx.lineTo(player.x, player.y + 12);
  ctx.lineTo(player.x + 17, player.y + 20);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = "#ffffff";
  ctx.fillRect(player.x - 3, player.y - 9, 6, 12);

  ctx.fillStyle = "#ff4477";
  ctx.fillRect(player.x - 9, player.y + 18, 5, 9);
  ctx.fillRect(player.x + 4, player.y + 18, 5, 9);
}

function drawEnemy(e) {
  const colors = {
    normal: "#ff4455",
    fast: "#ffaa22",
    tank: "#aa55ff",
    zigzag: "#44ff88"
  };

  ctx.fillStyle = colors[e.type];

  ctx.fillRect(e.x - e.w / 2, e.y - e.h / 2, e.w, e.h);
  ctx.fillStyle = "#111122";
  ctx.fillRect(e.x - 4, e.y - 3, 3, 4);
  ctx.fillRect(e.x + 2, e.y - 3, 3, 4);

  if (e.maxHp > 1) {
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(
      e.x - e.w / 2,
      e.y - e.h / 2 - 5,
      e.w * (e.hp / e.maxHp),
      2
    );
  }
}

function drawBoss() {
  ctx.fillStyle = "#ff2266";
  ctx.fillRect(
    boss.x - boss.w / 2,
    boss.y - boss.h / 2,
    boss.w,
    boss.h
  );

  ctx.fillStyle = "#6622aa";
  ctx.fillRect(boss.x - 30, boss.y - 12, 60, 25);

  ctx.fillStyle = "#ffffff";
  ctx.fillRect(boss.x - 18, boss.y - 6, 10, 8);
  ctx.fillRect(boss.x + 8, boss.y - 6, 10, 8);

  ctx.fillStyle = "#333333";
  ctx.fillRect(boss.x - 50, boss.y - 48, 100, 7);

  ctx.fillStyle = "#00ff66";
  ctx.fillRect(
    boss.x - 50,
    boss.y - 48,
    100 * Math.max(0, boss.hp / boss.maxHp),
    7
  );
}

const touch = {
  left: false,
  right: false,
  fire: false
};

function bindButton(id, property) {
  const element = document.getElementById(id);

  const start = e => {
    e.preventDefault();
    touch[property] = true;
    if (property === "fire") shoot();
  };

  const end = e => {
    e.preventDefault();
    touch[property] = false;
  };

  element.addEventListener("pointerdown", start);
  element.addEventListener("pointerup", end);
  element.addEventListener("pointercancel", end);
  element.addEventListener("pointerleave", end);
}

bindButton("left", "left");
bindButton("right", "right");
bindButton("fire", "fire");

addEventListener("keydown", e => {
  keys[e.key] = true;

  if (e.key === " " || e.key === "ArrowLeft" || e.key === "ArrowRight") {
    e.preventDefault();
  }
});

addEventListener("keyup", e => {
  keys[e.key] = false;
});

let drag = null;

canvas.addEventListener("pointerdown", e => {
  if (!running) return;

  drag = {
    id: e.pointerId,
    x: e.clientX,
    y: e.clientY
  };

  shoot();
});

canvas.addEventListener("pointermove", e => {
  if (!drag || drag.id !== e.pointerId || !running) return;

  const dx = e.clientX - drag.x;
  player.x += dx;
  player.x = Math.max(18, Math.min(W - 18, player.x));

  drag.x = e.clientX;
  drag.y = e.clientY;
});

canvas.addEventListener("pointerup", e => {
  if (drag && drag.id === e.pointerId) drag = null;
});

canvas.addEventListener("pointercancel", () => {
  drag = null;
});

function loop(time) {
  const dt = Math.min((time - last) / 1000 || 0, .033);
  last = time;

  update(dt);
  draw();

  requestAnimationFrame(loop);
}

updateHud();
requestAnimationFrame(loop);
</script>

</body>
</html>
