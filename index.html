<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no,
               viewport-fit=cover">

<title>PIXEL BLAST</title>

<style>
    * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #050510;
        touch-action: none;
        user-select: none;
    }

    body {
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: monospace;
    }

    canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        background: #050510;
        image-rendering: pixelated;
    }
</style>
</head>

<body>

<canvas id="game"></canvas>

<script>
"use strict";

/* =========================
   PIXEL BLAST
   ========================= */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d", {
    alpha: false
});

let W = 0;
let H = 0;
let dpr = 1;

function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);

    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);

    canvas.style.width = W + "px";
    canvas.style.height = H + "px";

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

window.addEventListener("resize", resize);
resize();

/* =========================
   GAME STATE
   ========================= */

let score = 0;
let lives = 3;
let level = 1;

let gameRunning = true;
let gameOver = false;

let lastTime = performance.now();

let spawnTimer = 0;
let shootTimer = 0;

const keys = {
    left: false,
    right: false,
    up: false,
    down: false,
    shoot: false
};

/* =========================
   PLAYER
   ========================= */

const player = {
    x: 0,
    y: 0,
    width: 38,
    height: 46,
    speed: 420
};

function resetPlayer() {
    player.x = W / 2;
    player.y = H - 90;
}

resetPlayer();

/* =========================
   OBJECTS
   ========================= */

const bullets = [];
const enemies = [];
const particles = [];
const stars = [];

/* =========================
   STARS
   ========================= */

for (let i = 0; i < 80; i++) {
    stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        speed: 30 + Math.random() * 120,
        size: Math.random() < 0.8 ? 1 : 2
    });
}

/* =========================
   INPUT
   ========================= */

window.addEventListener("keydown", e => {

    if (e.key === "ArrowLeft" || e.key === "a") {
        keys.left = true;
    }

    if (e.key === "ArrowRight" || e.key === "d") {
        keys.right = true;
    }

    if (e.key === "ArrowUp" || e.key === "w") {
        keys.up = true;
    }

    if (e.key === "ArrowDown" || e.key === "s") {
        keys.down = true;
    }

    if (e.code === "Space") {
        keys.shoot = true;
        e.preventDefault();
    }

    if (gameOver && e.key === "Enter") {
        restartGame();
    }
});

window.addEventListener("keyup", e => {

    if (e.key === "ArrowLeft" || e.key === "a") {
        keys.left = false;
    }

    if (e.key === "ArrowRight" || e.key === "d") {
        keys.right = false;
    }

    if (e.key === "ArrowUp" || e.key === "w") {
        keys.up = false;
    }

    if (e.key === "ArrowDown" || e.key === "s") {
        keys.down = false;
    }

    if (e.code === "Space") {
        keys.shoot = false;
    }
});

/* =========================
   TOUCH
   ========================= */

let touchStartX = 0;
let touchStartY = 0;

canvas.addEventListener("touchstart", e => {

    if (gameOver) {
        restartGame();
        return;
    }

    const touch = e.touches[0];

    touchStartX = touch.clientX;
    touchStartY = touch.clientY;

    keys.shoot = true;

}, { passive: false });

canvas.addEventListener("touchmove", e => {

    e.preventDefault();

    if (gameOver) return;

    const touch = e.touches[0];

    const dx = touch.clientX - touchStartX;
    const dy = touch.clientY - touchStartY;

    player.x += dx;
    player.y += dy;

    touchStartX = touch.clientX;
    touchStartY = touch.clientY;

    keepPlayerInside();

}, { passive: false });

canvas.addEventListener("touchend", e => {
    keys.shoot = false;
});

/* =========================
   PLAYER LIMIT
   ========================= */

function keepPlayerInside() {

    const halfW = player.width / 2;
    const halfH = player.height / 2;

    player.x = Math.max(
        halfW,
        Math.min(W - halfW, player.x)
    );

    player.y = Math.max(
        halfH + 30,
        Math.min(H - halfH, player.y)
    );
}

/* =========================
   SHOOT
   ========================= */

function shoot() {

    if (shootTimer > 0) return;

    bullets.push({
        x: player.x,
        y: player.y - player.height / 2,
        width: 4,
        height: 15,
        speed: 700
    });

    shootTimer = 0.16;
}

/* =========================
   ENEMY
   ========================= */

function spawnEnemy() {

    const size = 25 + Math.random() * 20;

    enemies.push({
        x: size + Math.random() * (W - size * 2),
        y: -size,
        size: size,
        speed: 80 + level * 15 + Math.random() * 60,
        hp: 1
    });
}

/* =========================
   PARTICLES
   ========================= */

function explosion(x, y) {

    for (let i = 0; i < 12; i++) {

        const angle =
            Math.random() * Math.PI * 2;

        const speed =
            50 + Math.random() * 180;

        particles.push({
            x: x,
            y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 0.45,
            maxLife: 0.45,
            size: 2 + Math.random() * 3
        });
    }
}

/* =========================
   COLLISION
   ========================= */

function hit(a, b) {

    return (
        a.x - a.width / 2 <
        b.x + b.size / 2 &&

        a.x + a.width / 2 >
        b.x - b.size / 2 &&

        a.y - a.height / 2 <
        b.y + b.size / 2 &&

        a.y + a.height / 2 >
        b.y - b.size / 2
    );
}

/* =========================
   UPDATE
   ========================= */

function update(dt) {

    if (!gameRunning) return;

    shootTimer -= dt;
    spawnTimer -= dt;

    /* Player keyboard */

    if (keys.left) {
        player.x -= player.speed * dt;
    }

    if (keys.right) {
        player.x += player.speed * dt;
    }

    if (keys.up) {
        player.y -= player.speed * dt;
    }

    if (keys.down) {
        player.y += player.speed * dt;
    }

    keepPlayerInside();

    /* Shooting */

    if (keys.shoot) {
        shoot();
    }

    /* Spawn enemies */

    if (spawnTimer <= 0) {

        spawnEnemy();

        spawnTimer =
            Math.max(
                0.25,
                0.85 - level * 0.04
            );
    }

    /* Bullets */

    for (let i = bullets.length - 1; i >= 0; i--) {

        const b = bullets[i];

        b.y -= b.speed * dt;

        if (b.y < -30) {
            bullets.splice(i, 1);
        }
    }

    /* Enemies */

    for (let i = enemies.length - 1; i >= 0; i--) {

        const e = enemies[i];

        e.y += e.speed * dt;

        /* Enemy hit player */

        const dx = e.x - player.x;
        const dy = e.y - player.y;

        const distance =
            Math.sqrt(dx * dx + dy * dy);

        if (distance <
            e.size / 2 +
            player.width / 2) {

            explosion(e.x, e.y);

            enemies.splice(i, 1);

            lives--;

            if (lives <= 0) {
                endGame();
            }

            continue;
        }

        /* Enemy reaches bottom */

        if (e.y > H + 50) {

            enemies.splice(i, 1);

            lives--;

            if (lives <= 0) {
                endGame();
            }

            continue;
        }

        /* Bullet collision */

        for (let j = bullets.length - 1; j >= 0; j--) {

            const b = bullets[j];

            if (hit(b, e)) {

                explosion(e.x, e.y);

                enemies.splice(i, 1);
                bullets.splice(j, 1);

                score += 10;

                level =
                    Math.floor(score / 200) + 1;

                break;
            }
        }
    }

    /* Particles */

    for (let i = particles.length - 1; i >= 0; i--) {

        const p = particles[i];

        p.x += p.vx * dt;
        p.y += p.vy * dt;

        p.life -= dt;

        if (p.life <= 0) {
            particles.splice(i, 1);
        }
    }

    /* Stars */

    for (const s of stars) {

        s.y += s.speed * dt;

        if (s.y > H) {
            s.y = -5;
            s.x = Math.random() * W;
        }
    }
}

/* =========================
   DRAW BACKGROUND
   ========================= */

function drawBackground() {

    ctx.fillStyle = "#050510";
    ctx.fillRect(0, 0, W, H);

    for (const s of stars) {

        ctx.fillStyle = "#ffffff";

        ctx.fillRect(
            Math.floor(s.x),
            Math.floor(s.y),
            s.size,
            s.size
        );
    }
}

/* =========================
   DRAW PLAYER
   ========================= */

function drawPlayer() {

    const x = Math.floor(player.x);
    const y = Math.floor(player.y);

    ctx.fillStyle = "#00eaff";

    ctx.beginPath();

    ctx.moveTo(x, y - 25);
    ctx.lineTo(x - 20, y + 20);
    ctx.lineTo(x, y + 12);
    ctx.lineTo(x + 20, y + 20);

    ctx.closePath();

    ctx.fill();

    ctx.fillStyle = "#ffffff";

    ctx.fillRect(
        x - 3,
        y - 12,
        6,
        14
    );

    /* Engine */

    ctx.fillStyle = "#ffcc00";

    ctx.fillRect(
        x - 5,
        y + 18,
        10,
        10
    );
}

/* =========================
   DRAW BULLETS
   ========================= */

function drawBullets() {

    ctx.fillStyle = "#00ff88";

    for (const b of bullets) {

        ctx.fillRect(
            Math.floor(b.x - b.width / 2),
            Math.floor(b.y),
            b.width,
            b.height
        );
    }
}

/* =========================
   DRAW ENEMIES
   ========================= */

function drawEnemies() {

    for (const e of enemies) {

        const x = Math.floor(e.x);
        const y = Math.floor(e.y);
        const s = Math.floor(e.size);

        ctx.fillStyle = "#ff3055";

        ctx.fillRect(
            x - s / 2,
            y - s / 2,
            s,
            s
        );

        ctx.fillStyle = "#050510";

        ctx.fillRect(
            x - s / 4,
            y - s / 6,
            5,
            5
        );

        ctx.fillRect(
            x + s / 8,
            y - s / 6,
            5,
            5
        );
    }
}

/* =========================
   DRAW PARTICLES
   ========================= */

function drawParticles() {

    for (const p of particles) {

        ctx.globalAlpha =
            Math.max(0, p.life / p.maxLife);

        ctx.fillStyle = "#ffcc00";

        ctx.fillRect(
            Math.floor(p.x),
            Math.floor(p.y),
            p.size,
            p.size
        );
    }

    ctx.globalAlpha = 1;
}

/* =========================
   UI
   ========================= */

function drawUI() {

    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 18px monospace";

    ctx.fillText(
        "SCORE: " + score,
        15,
        30
    );

    ctx.fillText(
        "LEVEL: " + level,
        15,
        55
    );

    ctx.fillText(
        "❤ ".repeat(Math.max(0, lives)),
        W - 75,
        30
    );
}

/* =========================
   GAME OVER
   ========================= */

function drawGameOver() {

    if (!gameOver) return;

    ctx.fillStyle =
        "rgba(0,0,0,0.75)";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );

    ctx.textAlign = "center";

    ctx.fillStyle = "#ff3055";

    ctx.font =
        "bold 42px monospace";

    ctx.fillText(
        "GAME OVER",
        W / 2,
        H / 2 - 45
    );

    ctx.fillStyle = "#ffffff";

    ctx.font =
        "bold 22px monospace";

    ctx.fillText(
        "SCORE: " + score,
        W / 2,
        H / 2
    );

    ctx.font =
        "18px monospace";

    ctx.fillText(
        "TAP TO RESTART",
        W / 2,
        H / 2 + 50
    );

    ctx.textAlign = "left";
}

/* =========================
   END GAME
   ========================= */

function endGame() {

    gameRunning = false;
    gameOver = true;

    const oldRecord =
        Number(
            localStorage.getItem(
                "pixelBlastRecord"
            ) || 0
        );

    if (score > oldRecord) {

        localStorage.setItem(
            "pixelBlastRecord",
            score
        );
    }
}

/* =========================
   RESTART
   ========================= */

function restartGame() {

    score = 0;
    lives = 3;
    level = 1;

    bullets.length = 0;
    enemies.length = 0;
    particles.length = 0;

    gameOver = false;
    gameRunning = true;

    spawnTimer = 0;
    shootTimer = 0;

    resetPlayer();
}

/* =========================
   MAIN LOOP
   ========================= */

function loop(now) {

    const dt =
        Math.min(
            (now - lastTime) / 1000,
            0.033
        );

    lastTime = now;

    update(dt);

    drawBackground();
    drawBullets();
    drawEnemies();
    drawParticles();
    drawPlayer();
    drawUI();
    drawGameOver();

    requestAnimationFrame(loop);
}

requestAnimationFrame(loop);

</script>

</body>
</html>
